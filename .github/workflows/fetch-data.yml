name: Fetch Energy Data

on:
  schedule:
    # Hourly. Each fetcher decides via its interval if it actually runs.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Ignore frequency gating and refresh everything'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      only:
        description: 'Run a single source (e.g. ecb, smard, gas_storage)'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/fetch-data.yml'

permissions:
  contents: write

# Cancel any in-progress run when a new one starts. Hourly cron makes this
# safe — we'd rather have one fresh complete run than stack two stale ones.
concurrency:
  group: fetch-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build CLI flags
        id: flags
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          if [ -n "${{ github.event.inputs.only }}" ]; then
            FLAGS="$FLAGS --only=${{ github.event.inputs.only }}"
          fi
          echo "flags=$FLAGS" >> $GITHUB_OUTPUT

      - name: Run fetchers
        id: run
        run: python scripts/fetch_all.py ${{ steps.flags.outputs.flags }}
        env:
          GIE_API_KEY:           ${{ secrets.GIE_API_KEY }}
          TANKERKOENIG_API_KEY:  ${{ secrets.TANKERKOENIG_API_KEY }}
          DESTATIS_API_TOKEN:    ${{ secrets.DESTATIS_API_TOKEN }}
          DESTATIS_USERNAME:     ${{ secrets.DESTATIS_USERNAME }}
          DESTATIS_PASSWORD:     ${{ secrets.DESTATIS_PASSWORD }}
          EIA_API_KEY:           ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY:          ${{ secrets.FRED_API_KEY }}
          ENTSOE_SECURITY_TOKEN: ${{ secrets.ENTSOE_SECURITY_TOKEN }}

      - name: Show results
        if: always()
        run: |
          echo "--- data/ ---"
          ls -lh data/ 2>/dev/null || echo "no data/"
          echo "--- meta.json ---"
          cat data/meta.json 2>/dev/null | head -100 || echo "no meta"

      # Conflict-free commit strategy.
      #
      # Why this is structured oddly: data/*.json are ALWAYS rewritten by every
      # fetcher run. A naive `git pull --rebase` will conflict on every line of
      # every file because timestamps/values changed concurrently. Auto-merge
      # produces garbage. So instead we:
      #   1. Snapshot freshly-fetched data/ to a temp location
      #   2. Hard-reset working tree to remote main (discarding the new data
      #      from the working tree, but they're safe in the snapshot)
      #   3. Restore the snapshot (which becomes the new HEAD content)
      #   4. Commit and push
      # If push still fails (race with another runner), retry up to 3 times.
      - name: Commit and push (conflict-safe)
        if: success()
        run: |
          set -e
          git config user.name  "github-actions-bot"
          git config user.email "actions@github.com"

          # Bail early if no data was fetched
          if [ ! -d data ] || [ -z "$(ls -A data 2>/dev/null)" ]; then
            echo "no data/ to commit"
            exit 0
          fi

          for attempt in 1 2 3; do
            echo "::group::commit attempt $attempt"

            # 1. Snapshot fresh data outside the working tree
            SNAP=$(mktemp -d)
            cp -r data/. "$SNAP/"

            # 2. Sync hard with remote main
            git fetch origin main
            git reset --hard origin/main
            # Remove anything still in working data/ that came from remote
            rm -rf data
            mkdir data

            # 3. Restore the snapshot — these become the staged changes
            cp -r "$SNAP/." data/
            rm -rf "$SNAP"

            # 4. Stage + check if anything actually changed vs remote
            git add data/
            if git diff --cached --quiet; then
              echo "no effective data changes vs remote — nothing to commit"
              echo "::endgroup::"
              exit 0
            fi

            git commit -m "data update $(date -u +%Y-%m-%dT%H:%MZ)"

            # 5. Push. If remote moved between fetch and push, retry.
            if git push origin main; then
              echo "::endgroup::"
              echo "push succeeded on attempt $attempt"
              exit 0
            fi

            echo "push rejected (likely concurrent push); retrying..."
            echo "::endgroup::"
            sleep $((5 * attempt))
          done

          echo "::error::push failed after 3 attempts"
          exit 1
